<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="第一视角 ASCII 飞行游戏：全部画面由彩色 ASCII 字符排列而成">
<title>ASCII FPV · 楼宇穿越</title>
<!-- 样式：base 管全局与画布，ui 管菜单 / 设置面板 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<!-- 画面全部画在这块画布上（字符网格，非像素渲染） -->
<canvas id="screen"></canvas>
<!-- DOM 只承载菜单 / 设置 / 结算面板 -->
<div id="ui"></div>
<noscript>本游戏需要启用 JavaScript。</noscript>

<!-- =====================================================================
     脚本按依赖顺序加载（不使用打包器，便于直接双击 file:// 打开）
     core     → 命名空间 / 数学 / 存储 / 全局状态
     i18n     → 中英文文案
     render   → 调色板 / 字符网格 / 光栅化 / 地面 / 场景 / HUD
     world    → 地图生成
     game     → 状态机 / 飞行力学 / 主循环
     input    → 键盘 / 触屏
     ui       → 菜单面板
     ===================================================================== -->
<script src="js/core/ns.js"></script>
<script src="js/core/math.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/state.js"></script>
<script src="js/i18n/zh.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/i18n.js"></script>
<script src="js/render/palette.js"></script>
<script src="js/render/grid.js"></script>
<script src="js/render/raster.js"></script>
<script src="js/render/ground.js"></script>
<script src="js/world/world.js"></script>
<script src="js/world/biomes.js"></script>
<script src="js/world/obstacles.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/game/fsm.js"></script>
<script src="js/game/player.js"></script>
<script src="js/input/input.js"></script>
<script src="js/input/touch.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/game/levels.js"></script>
<script src="js/game/states.js"></script>
<script src="js/game/loop.js"></script>
<script src="js/main.js"></script>
</body>
</html>
